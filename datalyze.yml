# Datalyze Tracking Agent. Written by Datalyze's setup; yours to edit.
#
# Two statuses: datalyze/rules (scripts only, every push, no model) and datalyze/tracking (the agent).
# Make both required checks on your default branch.
#
# On a pull request the agent proposes what tracking the change needs. Approve in Datalyze or comment
# `@datalyze apply`, and it builds and verifies the change on the branch. `@datalyze <anything>` on an
# issue or pull request asks it something else. Runs started from Datalyze: an audit, and fixes for the
# audit findings you pick (one pull request per product area), and a check of newly saved keys (no
# model runs: one read-only request to Anthropic and one to the analytics tool). Merging the setup pull
# request starts the first audit; each merge after that updates the Google Sheet.
#
# Secrets: ANTHROPIC_API_KEY (Claude runs on this runner with your key), DATALYZE_KEY (your workspace's
# key: the only thing sent to Datalyze), and the read-only analytics keys setup saved. No App secret:
# each run proves which repo it is with GitHub's OIDC token and gets the Datalyze App's token for this
# repo, so your CI runs on the agent's commits.
#
# A pull request from a fork is never built (Datalyze can't push to a fork). Its own run can't post a
# status, so the fork job does, on pull_request_target: it runs this file as your default branch has it
# and never checks out or runs the fork's code.

name: Datalyze
# A started run (and an `@datalyze apply`) names its job and target, so Datalyze's dashboard can say which run is which.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Datalyze: {0}{1}{2}', inputs.job, inputs.pr && format(' #{0}', inputs.pr) || '', inputs.findings && format(' {0}', inputs.findings) || '') || github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@datalyze apply') && format('Datalyze: apply #{0}', github.event.issue.number) || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [audit, implement, review, check]
      pr:
        description: Pull request number (review, implement)
        required: false
      findings:
        description: Audit finding ids, comma-separated (implement)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  id-token: write
  actions: write

jobs:
  rules:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: joindatalyze/tracking-agent@v2
        with:
          job: rules
          datalyze_key: ${{ secrets.DATALYZE_KEY }}

  # No checkout and no secrets but the default token: nothing from the fork runs.
  fork:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: joindatalyze/tracking-agent@v2
        with:
          job: fork

  agent:
    # Comments only from people who can write to the repo.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@datalyze') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # One run at a time per pull request (review, implement and `@datalyze apply`, which all push to the
    # branch); a newer push waits rather than cancelling one mid-commit. Any other comment queues on its
    # own, so it can never cancel the review waiting for the newest code. Fix runs per area, audits and
    # Sheet syncs each queue on their own.
    concurrency:
      group: datalyze-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.ref }}-${{ github.event_name == 'push' && 'sheet' || github.event_name == 'issue_comment' && !startsWith(github.event.comment.body, '@datalyze apply') && format('comment-{0}', github.event.comment.id) || inputs.pr && 'pr' || inputs.findings || inputs.job || 'pr' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: joindatalyze/tracking-agent@v2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          datalyze_key: ${{ secrets.DATALYZE_KEY }}
        env:
          # The analytics keys, only the ones setup saved.
          MIXPANEL_SA_USERNAME: ${{ secrets.MIXPANEL_SA_USERNAME }}
          MIXPANEL_SA_SECRET: ${{ secrets.MIXPANEL_SA_SECRET }}
          # The Google Sheet through Apps Script, if you connected it that way (otherwise Datalyze relays it).
          DATALYZE_SHEET_URL: ${{ secrets.DATALYZE_SHEET_URL }}
          DATALYZE_SHEET_TOKEN: ${{ secrets.DATALYZE_SHEET_TOKEN }}
