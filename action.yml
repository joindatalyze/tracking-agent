name: Datalyze Tracking Agent
description: Runs the Datalyze plugin for Claude Code on your pull requests, audits and approved tracking changes, with your own Anthropic key.
author: Datalyze
branding:
  icon: activity
  color: purple

inputs:
  job:
    description: "auto (picked from the event: review on a pull request, implement on `@datalyze apply` or a dispatch, audit on a dispatch, the Sheet on a push to the default branch) or rules (the datalyze/rules check, no model)"
    required: false
    default: auto
  anthropic_api_key:
    description: Your Anthropic API key. Claude runs on your runner with it.
    required: false
  datalyze_key:
    description: Your workspace's Datalyze key, for the licence check and the knowledge.
    required: false
  github_token:
    description: The workflow's own token, to read the pull request and to start one fix run per area.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Datalyze rules
      if: inputs.job == 'rules'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      run: |
        git config --global --add safe.directory "$PWD"
        node "$GITHUB_ACTION_PATH/bin/datalyze.js" action rules

    - name: Licence, token and job
      id: prepare
      if: inputs.job != 'rules'
      shell: bash
      env:
        INPUT_JOB: ${{ inputs.job }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      run: |
        git config --global --add safe.directory "$PWD"
        node "$GITHUB_ACTION_PATH/bin/datalyze.js" action prepare

    - name: Claude
      id: claude
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'agent'
      uses: anthropics/claude-code-action@v1
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ steps.prepare.outputs.token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        plugin_marketplaces: https://github.com/joindatalyze/claude-plugins.git
        plugins: datalyze@datalyze
        allowed_bots: ${{ steps.prepare.outputs.bot }},github-actions[bot]
        claude_args: --permission-mode acceptEdits --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash,mcp__plugin_datalyze_datalyze"

    # A free-form request pushes through claude-code-action itself, so it gets the workflow's own
    # token, never the App's: finish then gives the new head datalyze/rules and a review.
    - name: Claude (an @datalyze request)
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'tag'
      uses: anthropics/claude-code-action@v1
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        trigger_phrase: "@datalyze"
        plugin_marketplaces: https://github.com/joindatalyze/claude-plugins.git
        plugins: datalyze@datalyze
        claude_args: --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash,mcp__plugin_datalyze_datalyze"

    - name: Commit, report and status
      if: always() && steps.prepare.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
        CLAUDE_OUTCOME: ${{ steps.prepare.outputs.mode == 'agent' && steps.claude.outcome || '' }}
        CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action finish

    - name: Sheet
      if: steps.prepare.outputs.job == 'sheet'
      shell: bash
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action sheet
