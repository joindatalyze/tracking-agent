name: Datalyze Tracking Agent
description: Runs the Datalyze plugin for Claude Code on your pull requests, audits and approved tracking changes, with your own Anthropic key.
author: Datalyze
branding:
  icon: activity
  color: purple

inputs:
  job:
    description: "auto (picked from the event: review on a pull request, implement on `@datalyze apply` or a dispatch, audit on a dispatch, the Sheet on a push to the default branch), rules (the datalyze/rules check, no model) or fork (a fork's pull request on pull_request_target: both checks \"not checked\", nothing from the fork is run)"
    required: false
    default: auto
  anthropic_api_key:
    description: Your Anthropic API key. Claude runs on your runner with it.
    required: false
  datalyze_key:
    description: Your workspace's Datalyze key, for the licence check and the knowledge.
    required: false
  github_token:
    description: The workflow's own token, to read the pull request.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Datalyze rules
      if: inputs.job == 'rules'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      run: |
        git config --global --add safe.directory "$PWD"
        node "$GITHUB_ACTION_PATH/bin/datalyze.js" action rules

    # A fork's pull request, on pull_request_target: nothing is checked out, so no fork code runs here.
    - name: Datalyze (a fork's pull request)
      if: inputs.job == 'fork'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action fork

    # The last knowledge a run downloaded: when Datalyze can't be reached, a copy under 7 days old carries
    # the run on, and without one the pull request goes red, never green. Every download saves a new copy.
    - name: Datalyze knowledge copy
      if: inputs.job != 'rules' && inputs.job != 'fork'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/datalyze-knowledge
        key: datalyze-knowledge-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: datalyze-knowledge-

    - name: Licence, token and job
      id: prepare
      if: inputs.job != 'rules' && inputs.job != 'fork'
      shell: bash
      env:
        INPUT_JOB: ${{ inputs.job }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
        DATALYZE_KNOWLEDGE_CACHE: ${{ runner.temp }}/datalyze-knowledge
        # Only for the setup pull request's connection check (one read of the model list); Claude gets it below.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        git config --global --add safe.directory "$PWD"
        node "$GITHUB_ACTION_PATH/bin/datalyze.js" action prepare

    - name: Save the Datalyze knowledge copy
      if: steps.prepare.outputs.knowledge == 'downloaded'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/datalyze-knowledge
        key: datalyze-knowledge-${{ github.run_id }}-${{ github.run_attempt }}

    # Kept between runs: an audit's whole snapshot, which a pull request's review reuses for a day instead of
    # asking the analytics tool again (its hourly limits are shared by every run), and Amplitude's counts.
    # Every run restores the newest; only audits save, so a pull request's own cache never hides a newer audit's.
    - name: Datalyze run cache
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'agent'
      uses: actions/cache/restore@v4
      with:
        path: .datalyze/cache/runs
        key: datalyze-runs-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: datalyze-runs-

    # The audit's data pull installs DuckDB (a native binary the bundle can't carry) on first use;
    # this keeps it between runs. The version must match src/snapshot/pull/duckdb-runtime (a test checks).
    - name: DuckDB for the audit
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.job == 'audit'
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ~/.cache/datalyze/duckdb-1.5.6-r.2
        key: datalyze-duckdb-1.5.6-r.2-${{ runner.os }}-${{ runner.arch }}

    # Its failure doesn't end the job: check gives Claude a second pass, and finish publishes what there is.
    - name: Claude
      id: claude
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'agent'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ steps.prepare.outputs.token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        plugin_marketplaces: https://github.com/joindatalyze/claude-plugins.git
        plugins: datalyze@datalyze
        allowed_bots: ${{ steps.prepare.outputs.bot }},github-actions[bot]
        claude_args: --permission-mode acceptEdits --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash,mcp__plugin_datalyze_datalyze"

    # Unfinished work (Claude stopped, a check fails, items left): one more pass, told exactly what's left.
    - name: Check the work
      id: check
      if: ${{ !cancelled() && steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'agent' }}
      shell: bash
      env:
        CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action check

    - name: Claude (second pass)
      id: claude2
      if: ${{ !cancelled() && steps.check.outputs.retry == 'true' }}
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ steps.prepare.outputs.token }}
        prompt: ${{ steps.check.outputs.prompt }}
        plugin_marketplaces: https://github.com/joindatalyze/claude-plugins.git
        plugins: datalyze@datalyze
        allowed_bots: ${{ steps.prepare.outputs.bot }},github-actions[bot]
        claude_args: --permission-mode acceptEdits --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash,mcp__plugin_datalyze_datalyze"

    # A free-form request pushes through claude-code-action itself, so it gets the workflow's own
    # token, never the App's: finish then gives the new head datalyze/rules and a review.
    - name: Claude (an @datalyze request)
      id: claude_tag
      if: steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'tag'
      uses: anthropics/claude-code-action@v1
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        trigger_phrase: "@datalyze"
        plugin_marketplaces: https://github.com/joindatalyze/claude-plugins.git
        plugins: datalyze@datalyze
        claude_args: --allowedTools "Read,Grep,Glob,Edit,Write,Task,Bash,mcp__plugin_datalyze_datalyze"

    - name: Commit, report and status
      id: finish
      if: always() && steps.prepare.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
        CLAUDE_OUTCOME: ${{ steps.prepare.outputs.mode == 'agent' && (steps.check.outputs.retry == 'true' && steps.claude2.outcome || steps.claude.outcome) || '' }}
        CLAUDE_EXECUTION_FILE: ${{ steps.check.outputs.retry == 'true' && steps.claude2.outputs.execution_file || steps.claude.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action finish

    # The run's record (RUN-LOG.md): every step it went through, ok or not, from the step log and both
    # passes' transcripts. On the run's summary, under the pull request's report, and in the two artifacts.
    - name: The run's record
      if: always() && steps.prepare.outputs.run == 'true'
      shell: bash
      env:
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        # Only so the record can scrub it from the transcripts: Claude worked with this token.
        DATALYZE_APP_TOKEN: ${{ steps.prepare.outputs.token }}
        DATALYZE_ACTION_REF: ${{ github.action_ref }}
        CLAUDE_OUTCOME_1: ${{ steps.prepare.outputs.mode == 'tag' && steps.claude_tag.outcome || steps.claude.outcome }}
        CLAUDE_OUTCOME_2: ${{ steps.claude2.outcome }}
        CLAUDE_EXECUTION_FILE_1: ${{ steps.prepare.outputs.mode == 'tag' && steps.claude_tag.outputs.execution_file || steps.claude.outputs.execution_file }}
        CLAUDE_EXECUTION_FILE_2: ${{ steps.claude2.outputs.execution_file }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action record

    # run.json alone: the site reads it to show how the run went, so it's small and kept the longest GitHub allows.
    - name: Keep the run's record
      if: always() && steps.prepare.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: datalyze-run-record
        path: ${{ runner.temp }}/datalyze-run-record
        if-no-files-found: ignore
        overwrite: true
        retention-days: 90

    # Everything the record was built from (scrubbed of secrets), for whoever debugs the run.
    - name: Keep the run's log
      if: always() && steps.prepare.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: datalyze-run
        path: ${{ runner.temp }}/datalyze-run
        if-no-files-found: ignore
        overwrite: true
        include-hidden-files: true
        retention-days: 30

    # An audit's snapshot (and Amplitude's counts) for the next runs, kept even when the audit failed part-way.
    - name: Save the Datalyze run cache
      if: always() && steps.prepare.outputs.run == 'true' && steps.prepare.outputs.mode == 'agent' && steps.prepare.outputs.job == 'audit'
      uses: actions/cache/save@v4
      with:
        path: .datalyze/cache/runs
        key: datalyze-runs-${{ github.run_id }}-${{ github.run_attempt }}

    # A finished run's work that didn't go up (an outage, a build that needs a person, Claude stopping
    # early): finish left it here, so it outlives the runner. Nothing there, nothing uploaded.
    - name: Keep what couldn't be pushed
      if: always() && steps.prepare.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: datalyze-unpublished
        path: ${{ runner.temp }}/datalyze-unpublished
        if-no-files-found: ignore
        include-hidden-files: true
        retention-days: 30

    # On the merge that brings this workflow in, with no plan yet, it starts the first audit instead.
    - name: Sheet
      if: steps.prepare.outputs.job == 'sheet'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        DATALYZE_KEY: ${{ inputs.datalyze_key }}
      run: node "$GITHUB_ACTION_PATH/bin/datalyze.js" action sheet
